name: Validate GTA6 Shorts Factory
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --input-type=module --check < src/index.js
      - name: Compile renderer scripts
        run: python -m py_compile renderer/render.py renderer/youtube_upload.py tests/test_renderer.py
      - name: Run renderer unit tests
        run: python -m unittest discover -s tests -v
      - name: Install media tools for integration render
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
      - name: Render synthetic clip end-to-end
        timeout-minutes: 6
        env:
          RENDER_TEST_MODE: "1"
        run: |
          mkdir -p branding
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "color=c=blue@0.35:s=1080x160:d=1,format=rgba" -frames:v 1 branding/banner.png
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "color=c=yellow@0.65:s=200x200:d=1,format=rgba" -frames:v 1 branding/logo.png
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "color=c=green@0.65:s=390x120:d=1,format=rgba" -frames:v 1 branding/subscribe.png
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "color=c=red@0.65:s=125x125:d=1,format=rgba" -frames:v 1 branding/notification.png
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "color=c=black@0.65:s=1080x1920:d=1,format=rgba" -frames:v 1 branding/outro.png
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x180:rate=10 -f lavfi -i sine=frequency=440:duration=26 -t 26 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac fixture.mp4
          python renderer/render.py --source-url https://clips.twitch.tv/CIOnlyFixture --test-local-source fixture.mp4 --title "GTA 6 CI Render Test" --output ci-short.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,codec_name -of csv=p=0 ci-short.mp4)" = "1080,1920,h264"
          test -s render-analysis.json
          test -s short-cover.jpg
          python -c "import json; a=json.load(open('render-analysis.json')); assert a['audio']['present'] is True and a['usable_for_shorts'] is True"
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x180:rate=10 -t 26 -map 0:v:0 -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p silent-fixture.mp4
          test "$(ffprobe -v error -show_entries stream=codec_type -of csv=p=0 silent-fixture.mp4)" = "video"
          if python renderer/render.py --source-url https://clips.twitch.tv/CIOnlyFixture --test-local-source silent-fixture.mp4 --title "GTA 6 Silent Source Test" --output ci-short-noaudio.mp4 > silent-render.log 2>&1; then echo "Silent source must be rejected"; cat silent-render.log; exit 1; fi
          cat silent-render.log
          grep -q "Original Twitch clip has no audio stream" silent-render.log
          test ! -s ci-short-noaudio.mp4
      - name: Check required deployment files
        run: |
          test -s wrangler.toml
          test -s package.json
          test -s .github/workflows/render-short.yml
          test -s renderer/render.py
          test -s renderer/youtube_upload.py
          test -s tests/test_renderer.py
