name: Validate GTA6 Shorts Factory
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --input-type=module --check < src/index.js
      - name: Compile renderer scripts
        run: python -m py_compile renderer/render.py renderer/youtube_upload.py tests/test_renderer.py
      - name: Run renderer unit tests
        run: python -m unittest discover -s tests -v
      - name: Install media tools for integration render
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Render synthetic clip end-to-end
        env:
          RENDER_TEST_MODE: "1"
        run: |
          ffmpeg -y -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=frequency=440:duration=4 -t 4 -c:v libx264 -pix_fmt yuv420p -c:a aac fixture.mp4
          python renderer/render.py --source-url https://clips.twitch.tv/CIOnlyFixture --test-local-source fixture.mp4 --title "GTA 6 CI Render Test" --narration "This is an isolated rendering test for the vertical video pipeline." --rights-approved true --output ci-short.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,codec_name -of csv=p=0 ci-short.mp4
      - name: Check required deployment files
        run: |
          test -s wrangler.toml
          test -s package.json
          test -s .github/workflows/render-short.yml
          test -s renderer/render.py
          test -s renderer/youtube_upload.py
          test -s tests/test_renderer.py
