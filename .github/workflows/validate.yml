name: Validate GTA6 Shorts Factory
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint GitHub Actions workflows
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
      - name: Check Worker JavaScript syntax
        run: node --input-type=module --check < src/index.js
      - name: Check dashboard JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const source = readFileSync("src/index.js", "utf8");
          const html = source.match(/const HTML = String\.raw`([\s\S]*?)`;\n\nconst json=/);
          if (!html) throw new Error("Dashboard HTML template was not found.");
          const script = html[1].match(/<script>([\s\S]*?)<\/script>/);
          if (!script) throw new Error("Dashboard script was not found.");
          writeFileSync("/tmp/dashboard.js", script[1]);
          NODE
          node --check /tmp/dashboard.js
      - name: Compile renderer scripts
        run: python -m py_compile renderer/render.py renderer/youtube_upload.py renderer/prepare_branding.py tests/test_renderer.py
      - name: Run renderer unit tests
        run: python -m unittest discover -s tests -v
      - name: Install media tools for integration render
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install pillow
      - name: Render synthetic clip end-to-end
        timeout-minutes: 6
        env:
          RENDER_TEST_MODE: "1"
        run: |
          set -euxo pipefail
          mkdir -p branding
          python renderer/prepare_branding.py
          test -s branding/subscribe.png
          test -s branding/notification.png
          python - <<'PY'
          from PIL import Image
          for name in ("branding/subscribe.png", "branding/notification.png"):
              alpha = Image.open(name).convert("RGBA").getchannel("A")
              low, high = alpha.getextrema()
              assert low == 0 and high == 255, (name, low, high)
          PY
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "color=c=blue@0.35:s=1080x160:d=1,format=rgba" -frames:v 1 branding/banner.png
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "color=c=yellow@0.65:s=200x200:d=1,format=rgba" -frames:v 1 branding/logo.png
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "color=c=green@0.65:s=390x120:d=1,format=rgba" -frames:v 1 branding/subscribe.png
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "color=c=red@0.65:s=125x125:d=1,format=rgba" -frames:v 1 branding/notification.png
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "color=c=black@0.65:s=1080x1920:d=1,format=rgba" -frames:v 1 branding/outro.png
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x180:rate=10 -f lavfi -i sine=frequency=440:duration=26 -t 26 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac fixture.mp4
          python renderer/render.py --source-url https://example.com/CIOnlyFixture --test-local-source fixture.mp4 --title "GTA 6 CI Render Test" --output ci-short.mp4
          python - <<'PY'
          import json, subprocess
          info = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-select_streams", "v:0",
              "-show_entries", "stream=width,height,codec_name",
              "-of", "json", "ci-short.mp4"
          ], text=True))
          video = info["streams"][0]
          assert (video["width"], video["height"], video["codec_name"]) == (1080, 1920, "h264"), video
          PY
          test -s render-analysis.json
          test -s short-cover.jpg
          python -c "import json; a=json.load(open('render-analysis.json')); assert a['audio']['present'] is True and a['usable_for_shorts'] is True"
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x180:rate=10 -t 26 -map 0:v:0 -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p silent-fixture.mp4
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          output = Path("silent-rejected.mp4")
          output.unlink(missing_ok=True)
          result = subprocess.run(
              [sys.executable, "renderer/render.py",
               "--source-url", "https://example.com/CIOnlyFixture.mp4",
               "--test-local-source", "silent-fixture.mp4",
               "--title", "GTA 6 Silent Source Test",
               "--output", str(output)],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              env=os.environ.copy(), timeout=120
          )
          print(result.stdout)
          assert result.returncode != 0, "Silent source was incorrectly accepted"
          assert "Source clip has no audio stream" in result.stdout, "Renderer failed for an unexpected reason"
          assert not output.exists() or output.stat().st_size == 0, "A silent MP4 was incorrectly produced"
          print("PASS: silent source rejected without producing an MP4")
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x180:rate=10 -f lavfi -i sine=frequency=520:duration=8 -t 26 -map 0:v:0 -map 1:a:0 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 160k cut-audio-fixture.mp4
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          output = Path("cut-audio-rejected.mp4")
          output.unlink(missing_ok=True)
          result = subprocess.run(
              [sys.executable, "renderer/render.py",
               "--source-url", "https://example.com/CIOnlyFixture-cut-audio.mp4",
               "--test-local-source", "cut-audio-fixture.mp4",
               "--title", "GTA 6 Cut Audio Test",
               "--output", str(output)],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              env=os.environ.copy(), timeout=120
          )
          print(result.stdout)
          assert result.returncode != 0, "Short with audio ending early was incorrectly accepted"
          assert "audio track ends early" in result.stdout or "audio is silent for the final" in result.stdout, "Renderer rejected cut audio for an unexpected reason"
          print("PASS: cut-off audio rejected before publish")
          PY
          PY
      - name: Verify YouTube OAuth refresh token without uploading
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python renderer/youtube_auth_check.py
      - name: Check required deployment files
        run: |
          test -s wrangler.toml
          test -s package.json
          test -s .github/workflows/render-short.yml
          test -s renderer/prepare_branding.py
          test -s renderer/render.py
          test -s renderer/youtube_upload.py
          test -s tests/test_renderer.py
