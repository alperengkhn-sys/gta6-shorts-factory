name: Render GTA6 Short
on:
  push:
    paths:
      - "render-queue/*.json"
  workflow_dispatch:
    inputs:
      source_url:
        description: Public Twitch clip URL
        required: true
        type: string
      title:
        description: Short title
        required: true
        type: string
      description:
        description: YouTube description and credit
        required: false
        type: string
      job_id:
        description: Optional originating Worker job ID
        required: false
        type: string
      render_attempt:
        description: Worker render attempt number for stale-callback protection
        required: false
        type: string
      creator_name:
        description: Original creator / source channel
        required: false
        type: string
      source_title:
        description: Original source title
        required: false
        type: string
      package_text:
        description: Full editorial TXT package
        required: false
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: gta6-shorts-youtube-publish-${{ inputs.job_id || github.run_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Load queued render task
        id: task
        if: github.event_name == 'push'
        run: |
          FILE="$(git show --pretty="" --name-only HEAD | awk 'index($0,"render-queue/")==1 && substr($0,length($0)-4)==".json" {print; exit}')"
          if [ -z "$FILE" ]; then echo "::error::No render task found in queue commit."; exit 1; fi
          python - "$FILE" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          task = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("noop=" + ("true" if task.get("noop") else "false"))
          for key in ("source_url", "title", "description", "job_id", "render_attempt", "creator_name", "source_title"):
              print(f"{key}={str(task.get(key, '')).replace(chr(10), ' ')}")
          print("package_text<<GTA6_TASK_EOF")
          print(str(task.get("package_text", "")))
          print("GTA6_TASK_EOF")
          PY
      - name: Check whether this Twitch clip was already published
        id: dedupe
        if: steps.task.outputs.noop != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_URL: ${{ inputs.source_url || steps.task.outputs.source_url }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, os
          from pathlib import Path
          from urllib.parse import urlsplit

          raw = os.environ["SOURCE_URL"].strip()
          parsed = urlsplit(raw)
          host = (parsed.hostname or "").lower().rstrip(".")
          path = parsed.path.rstrip("/")

          # Canonicalize Twitch clip URLs so equivalent public forms cannot
          # bypass the duplicate-upload marker.
          parts = [part for part in path.split("/") if part]
          if host == "clips.twitch.tv" and parts:
              canonical = "twitch:clip:" + parts[-1]
          elif host.endswith("twitch.tv") and "clip" in parts:
              clip_index = next((i for i, part in enumerate(parts) if part.lower() == "clip"), None)
              canonical = "twitch:clip:" + parts[clip_index + 1] if clip_index is not None and clip_index + 1 < len(parts) else raw
          else:
              canonical = (host + path).lower() if host else raw

          key = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          marker = Path(".github/published-clips") / (key + ".json")
          print("canonical_source=" + canonical)
          print("key=" + key)
          print("already_published=" + ("true" if marker.is_file() else "false"))
          if marker.is_file():
              print("Existing YouTube publication marker found; duplicate upload will be skipped.")
          PY
      - name: Install media tools
        if: steps.task.outputs.noop != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install yt-dlp edge-tts pillow
      - name: Prepare transparent channel overlays
        if: steps.task.outputs.noop != 'true'
        run: python renderer/prepare_branding.py
      - name: Render vertical MP4
        if: steps.task.outputs.noop != 'true'
        id: render
        env:
          SOURCE_URL: ${{ inputs.source_url || steps.task.outputs.source_url }}
          SHORT_TITLE: ${{ inputs.title || steps.task.outputs.title }}
          PACKAGE_TEXT: ${{ inputs.package_text || steps.task.outputs.package_text }}
          OFFLINE_MIN_SCORE: "60"
        run: |
          python renderer/render.py \
            --source-url "$SOURCE_URL" \
            --title "$SHORT_TITLE" \
            --output short.mp4
      - name: Build numbered delivery package
        if: steps.task.outputs.noop != 'true'
        env:
          SOURCE_URL: ${{ inputs.source_url || steps.task.outputs.source_url }}
          CREATOR_NAME: ${{ inputs.creator_name || steps.task.outputs.creator_name }}
          ORIGINAL_TITLE: ${{ inputs.source_title || steps.task.outputs.source_title }}
          PACKAGE_TEXT: ${{ inputs.package_text || steps.task.outputs.package_text }}
          YOUTUBE_DESCRIPTION: ${{ inputs.description || steps.task.outputs.description }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          number = os.environ["RUN_NUMBER"]
          script = os.environ.get("PACKAGE_TEXT", "").strip()
          description = os.environ.get("YOUTUBE_DESCRIPTION", "").strip()
          analysis = {}
          try:
              analysis = json.loads(Path("render-analysis.json").read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              pass
          vision = analysis.get("vision_review", {})
          mature = analysis.get("mature_content_editing", {})
          content_review = [
              "CONTENT REVIEW:",
              f"Visual category: {vision.get('category', 'unknown')}",
              f"Editing treatment: {vision.get('editing_treatment', 'standard')}",
              f"Age restriction recommended: {vision.get('age_restriction_recommended', False)}",
              f"Age restriction status: {vision.get('age_restriction_status', 'not_assessed')}",
              f"Mature-scene notice applied: {mature.get('applied', False)}",
              "Note: YouTube's Data API does not expose a creator-set age-restriction control; platform review/Studio setting remains authoritative.",
              ""
          ]
          def section(name):
              pattern = r"(?m)^" + re.escape(name) + r":\s*\n([\s\S]*?)(?=\n[A-Z][A-Z /_-]+:|\Z)"
              match = re.search(pattern, script)
              return match.group(1).strip() if match else "Review the full editorial package below."
          tags = "GTA 6, GTA VI, Grand Theft Auto VI, GTA 6 gameplay, GTA 6 clips, GTA 6 moments, GTA 6 shorts, gaming shorts, Vice City, Leonida, Rockstar Games"
          lines = [
              f"GTA VI SHORTS — DELIVERY PACKAGE #{number}", "",
              f"SOURCE CLIP: {os.environ.get('SOURCE_URL','')}",
              f"STREAMER: {os.environ.get('CREATOR_NAME','Unknown')}",
              f"ORIGINAL CLIP TITLE: {os.environ.get('ORIGINAL_TITLE','')}", "",
              "SUGGESTED SHORTS TITLE:", section("PROPOSED TITLE"), "",
              "HOOK / OPENING:", section("HOOK / OPENING"), "",
              "VOICEOVER DRAFT:", section("ORIGINAL VOICEOVER DRAFT"), "",
              "CAPTION DRAFT:", section("CAPTION TEXT DRAFT"), "",
              "9:16 EDIT PLAN:", section("9:16 EDITING PLAN"), "",
              "YOUTUBE DESCRIPTION:", description, "",
              "YOUTUBE TAGS:", tags, "",
              "HASHTAGS:", "#GTA6 #GTAVI #GTAVIGameplay #GamingShorts #Shorts", "",
              "FULL EDITORIAL PACKAGE:", script, "",
              *content_review,
              "NOTE: Clip creator credit is included in the description. All generated titles, descriptions, tags and hashtags are English."
          ]
          Path(f"GTA6-Short-{number}.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          Path(f"GTA6-Short-{number}.mp4").write_bytes(Path("short.mp4").read_bytes())
          Path(f"GTA6-Short-{number}-cover.jpg").write_bytes(Path("short-cover.jpg").read_bytes())
          PY
      - name: Build combined ZIP package
        if: steps.task.outputs.noop != 'true'
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          number = os.environ["RUN_NUMBER"]
          files = [Path(f"GTA6-Short-{number}.mp4"), Path(f"GTA6-Short-{number}.txt"), Path(f"GTA6-Short-{number}-cover.jpg"), Path("render-analysis.json")]
          with zipfile.ZipFile(f"GTA6-Short-{number}-PACKAGE.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for path in files:
                  if not path.is_file():
                      raise SystemExit(f"Missing delivery file: {path}")
                  archive.write(path, path.name)
              branding = Path("branding")
              if branding.is_dir():
                  for path in sorted(branding.rglob("*")):
                      if path.is_file() and path.name.lower() != "readme.md":
                          archive.write(path, str(Path("branding") / path.relative_to(branding)))
          PY
      - name: Publish direct MP4 and package ZIP
        if: steps.task.outputs.noop != 'true'
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TAG="gta6-short-${RUN_NUMBER}"
          MP4="GTA6-Short-${RUN_NUMBER}.mp4"
          TXT="GTA6-Short-${RUN_NUMBER}.txt"
          COVER="GTA6-Short-${RUN_NUMBER}-cover.jpg"
          ZIP="GTA6-Short-${RUN_NUMBER}-PACKAGE.zip"
          gh release create "$TAG" "$MP4" "$TXT" "$COVER" "$ZIP" --title "GTA6 Short #${RUN_NUMBER}" --notes "Rendered GTA VI Short delivery: MP4, editorial TXT, cover JPG and combined ZIP package." || gh release upload "$TAG" "$MP4" "$TXT" "$COVER" "$ZIP" --clobber
          BASE="https://github.com/${REPOSITORY}/releases/download/${TAG}"
          echo "mp4_url=${BASE}/${MP4}" >> "$GITHUB_OUTPUT"
          echo "package_url=${BASE}/${ZIP}" >> "$GITHUB_OUTPUT"
      - name: Upload MP4, ZIP, cover, and media analysis
        if: steps.task.outputs.noop != 'true'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: gta6-short-${{ github.run_number }}
          path: |
            GTA6-Short-*.mp4
            GTA6-Short-*.txt
            GTA6-Short-*-cover.jpg
            GTA6-Short-*-PACKAGE.zip
            render-analysis.json
          if-no-files-found: error
          retention-days: 7
      - name: Choose YouTube privacy based on content review
        id: privacy
        if: steps.task.outputs.noop != 'true' && steps.dedupe.outputs.already_published != 'true' && success()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          analysis = json.loads(Path("render-analysis.json").read_text(encoding="utf-8"))
          review = analysis.get("vision_review", {})
          # Channel owner requires automatic public Shorts publishing.
          # YouTube Data API cannot set an age gate; never silently switch to private.
          privacy = "public"
          print("privacy=" + privacy)
          print("reason=automatic_publication")
          PY
      - name: Automatically publish YouTube Short
        id: youtube
        if: steps.task.outputs.noop != 'true' && steps.dedupe.outputs.already_published != 'true' && success()
        env:
          SHORT_TITLE: ${{ inputs.title || steps.task.outputs.title }}
          SHORT_DESCRIPTION: ${{ inputs.description || steps.task.outputs.description }}
          SHORT_PRIVACY_STATUS: ${{ steps.privacy.outputs.privacy }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python renderer/youtube_upload.py
      - name: Record successful YouTube upload to prevent duplicates
        if: startsWith(steps.youtube.outputs.upload_status, 'uploaded_')
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_URL: ${{ inputs.source_url || steps.task.outputs.source_url }}
          VIDEO_URL: ${{ steps.youtube.outputs.video_url }}
          TITLE: ${{ inputs.title || steps.task.outputs.title }}
          UPLOAD_STATUS: ${{ steps.youtube.outputs.upload_status }}
          KEY: ${{ steps.dedupe.outputs.key }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Multiple Shorts can finish together; rebase marker writes safely
          # instead of failing on another job's concurrent main-branch push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .github/published-clips
            python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(".github/published-clips") / (os.environ["KEY"] + ".json")
          if not path.exists():
              path.write_text(json.dumps({
                  "source_url": os.environ["SOURCE_URL"],
                  "video_url": os.environ["VIDEO_URL"],
                  "title": os.environ["TITLE"],
                  "status": os.environ["UPLOAD_STATUS"]
              }, indent=2) + "\n", encoding="utf-8")
          PY
            git add .github/published-clips
            if git diff --cached --quiet; then
              echo "Publication marker already recorded."
              exit 0
            fi
            git commit -m "Record published GTA6 clip to prevent duplicate uploads"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Concurrent publication-marker push; retrying after fetching main."
            sleep $((attempt * 2))
          done
          echo "::error::Could not record publication marker after five attempts."
          exit 1
      - name: Report render result to Cloudflare Worker
        if: always() && steps.task.outputs.noop != 'true'
        env:
          WEBHOOK_SECRET: ${{ secrets.RENDER_WEBHOOK_SECRET }}
          JOB_ID: ${{ inputs.job_id || steps.task.outputs.job_id }}
          RENDER_ATTEMPT: ${{ inputs.render_attempt || steps.task.outputs.render_attempt }}
          CONCLUSION: ${{ job.status }}
          RENDER_CONCLUSION: ${{ steps.render.outcome }}
          YOUTUBE_STATUS: ${{ steps.youtube.outputs.upload_status }}
          YOUTUBE_URL: ${{ steps.youtube.outputs.video_url }}
          YOUTUBE_ERROR: ${{ steps.youtube.outputs.error }}
          THUMBNAIL_STATUS: ${{ steps.youtube.outputs.thumbnail_status }}
          ARTIFACT_URL: ${{ steps.release.outputs.mp4_url }}
          PACKAGE_URL: ${{ steps.release.outputs.package_url }}
          FALLBACK_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$JOB_ID" ]; then echo "No originating Worker job; callback skipped."; exit 0; fi
          if [ -z "$WEBHOOK_SECRET" ]; then echo "::warning::RENDER_WEBHOOK_SECRET is not configured; Worker status will not update."; exit 0; fi
          python - <<'PY' > callback.json
          import json, os
          from pathlib import Path
          payload = {
            "job_id": os.environ["JOB_ID"],
            "render_attempt": int(os.environ["RENDER_ATTEMPT"]) if os.environ.get("RENDER_ATTEMPT", "").isdigit() else None,
            "conclusion": os.environ["CONCLUSION"],
            "render_conclusion": os.environ.get("RENDER_CONCLUSION", ""),
            "youtube_status": os.environ.get("YOUTUBE_STATUS", "") or "not_configured",
            "youtube_url": os.environ.get("YOUTUBE_URL", ""),
            "thumbnail_status": os.environ.get("THUMBNAIL_STATUS", "") or "not_available",
            "error": os.environ.get("YOUTUBE_ERROR", "") or ("" if os.environ["RENDER_CONCLUSION"] == "success" else "GitHub Actions render failed; inspect the workflow run."),
            "artifact_url": os.environ.get("ARTIFACT_URL", "") or os.environ.get("FALLBACK_ARTIFACT_URL", ""),
            "package_url": os.environ.get("PACKAGE_URL", ""),
            "run_url": os.environ.get("RUN_URL", "")
          }
          analysis_path = Path("render-analysis.json")
          if analysis_path.is_file():
            try:
              payload["media_analysis"] = json.loads(analysis_path.read_text(encoding="utf-8"))
            except (OSError, json.JSONDecodeError):
              payload["media_analysis_error"] = "Analysis file could not be parsed."
          print(json.dumps(payload))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            "https://gta6-shorts-engine.alperen-gkhn.workers.dev/api/render/callback" \
            -H "Content-Type: application/json" \
            -H "X-Render-Secret: $WEBHOOK_SECRET" \
            --data-binary @callback.json
