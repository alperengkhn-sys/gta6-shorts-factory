name: Deploy GTA6 Shorts Worker
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gta6-shorts-worker-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub repository Actions secrets."
            exit 1
          fi
          npx --yes wrangler@4.45.0 deploy
      - name: Verify deployed Worker build
        env:
          EXPECTED_WORKER_VERSION: GTA6-FACTORY-6.6-SEO-DRAFT-PIPELINE
          RENDER_WEBHOOK_SECRET: ${{ secrets.RENDER_WEBHOOK_SECRET }}
        run: |
          if [ -z "$RENDER_WEBHOOK_SECRET" ]; then
            echo "::error::RENDER_WEBHOOK_SECRET is required for the protected Worker version check."
            exit 1
          fi
          STATUS="$(curl --retry 3 --retry-all-errors --retry-delay 2 --fail-with-body --silent --show-error --max-time 30 -H "X-Render-Secret: $RENDER_WEBHOOK_SECRET" "https://gta6-shorts-engine.alperen-gkhn.workers.dev/api/system/status")"
          printf '%s' "$STATUS" | python -c 'import json,os,sys; d=json.load(sys.stdin); actual=d.get("version",""); expected=os.environ["EXPECTED_WORKER_VERSION"]; print("Deployed Worker version:",actual); assert actual==expected, f"Expected {expected}, received {actual}"'
      - name: Start automatic production cycle after every Worker deployment
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          RENDER_WEBHOOK_SECRET: ${{ secrets.RENDER_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          set +e
          HTTP_CODE="$(curl --silent --show-error --max-time 600 -o /tmp/prepare-response.json -w '%{http_code}' -X POST "https://gta6-shorts-engine.alperen-gkhn.workers.dev/api/prepare" -H "Content-Type: application/json" -H "X-Render-Secret: $RENDER_WEBHOOK_SECRET" --data '{}')"
          CURL_STATUS=$?
          set -e
          if [ "$CURL_STATUS" -ne 0 ] || [ "$HTTP_CODE" != "200" ]; then
            if grep -qi "exceeded D1's free tier daily row read limit" /tmp/prepare-response.json 2>/dev/null; then
              echo "::warning::Discovery/prepare smoke skipped because Cloudflare D1's Free daily read quota is exhausted. Worker version check passed; the next scheduled cycle can retry after quota reset."
              exit 0
            fi
            cat /tmp/prepare-response.json 2>/dev/null || true
            echo "::error::Worker production cycle failed (HTTP $HTTP_CODE, curl $CURL_STATUS)."
            exit 1
          fi
          RESPONSE="$(cat /tmp/prepare-response.json)"
          printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); r=d.get("rendering",{}); print("Prepared:",d.get("created",0),"updated:",d.get("updated",0),"existing:",d.get("existing",0),"skipped_permissions:",d.get("skipped_permission",0)); disc=d.get("discovery",{}); print("Twitch discovery:",json.dumps(disc,ensure_ascii=False)); print("Discovery runtime metrics:",json.dumps({k:disc.get(k) for k in ("category_pages_scanned","category_clips_scanned","profile_lookup_errors","female_candidate_channels_checked","female_candidate_profiles_verified","female_candidate_clips_scanned","female_candidate_clips_added","female_candidate_lookup_errors")},ensure_ascii=False)); assert disc.get("error") or all(k in disc for k in ("category_pages_scanned","category_clips_scanned","profile_lookup_errors","female_candidate_channels_checked","female_candidate_profiles_verified","female_candidate_clips_scanned","female_candidate_clips_added","female_candidate_lookup_errors")), "Deployed Worker did not return dynamic discovery metrics"; print("Clip validation:",json.dumps(d.get("clip_validation",{}),ensure_ascii=False)); print("Duration validation:",json.dumps(d.get("duration_validation",{}),ensure_ascii=False)); a=d.get("download_access",{}); print("Twitch download access:",json.dumps({k:a.get(k) for k in ("twitch_oauth_connected","twitch_download_scope_available","requires_twitch_connection","missing_scopes","processed","checked_this_cycle","broadcasters_checked","downloadable","unauthorized","not_available","errors","remaining")},ensure_ascii=False)); print("Batch result:",json.dumps({k:r.get(k) for k in ("batch_id","batch_status","target_minimum","maximum_successes","eligible","attempted","dispatched","already_existing","dispatchErrors","attempts_total","pending","published","failed")},ensure_ascii=False)); print("Dispatch error details:",json.dumps(r.get("errors",[])[:10],ensure_ascii=False)); sys.exit(1 if r.get("dispatchErrors",0) else 0)'

# Production bootstrap marker: the matching commit message starts the first cycle.
