name: Deploy GTA6 Shorts Worker
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub repository Actions secrets."
            exit 1
          fi
          npx --yes wrangler@4.45.0 deploy
      - name: Start initial automatic production cycle
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 600 -X POST "https://gta6-shorts-engine.alperen-gkhn.workers.dev/api/prepare" -H "Content-Type: application/json" --data '{}')"
          echo "$RESPONSE"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); r=d.get("rendering",{}); print("Eligible:",r.get("eligible",0),"Dispatched:",r.get("dispatched",0),"Dispatch errors:",r.get("dispatchErrors",0)); sys.exit(1 if r.get("dispatchErrors",0) else 0)' "$RESPONSE"
