name: Deploy GTA6 Shorts Worker
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gta6-shorts-worker-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub repository Actions secrets."
            exit 1
          fi
          npx --yes wrangler@4.45.0 deploy
      - name: Start initial automatic production cycle
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[initial-production]')
        env:
          RENDER_WEBHOOK_SECRET: ${{ secrets.RENDER_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --retry 3 --retry-all-errors --retry-delay 2 --fail-with-body --silent --show-error --max-time 600 -X POST "https://gta6-shorts-engine.alperen-gkhn.workers.dev/api/prepare" -H "Content-Type: application/json" -H "X-Render-Secret: $RENDER_WEBHOOK_SECRET" --data '{}')"
          printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); r=d.get("rendering",{}); a=d.get("access",{}); p=d.get("prepared",{}); print("Prepared:",p.get("created",0),"updated:",p.get("updated",0),"existing:",p.get("existing",0)); print("Twitch downloadable:",a.get("downloadable",0),"unauthorized:",a.get("unauthorized",0),"not_available:",a.get("not_available",0),"errors:",a.get("errors",0)); print("API error details:",json.dumps(a.get("error_details",[]),ensure_ascii=False)); print("Eligible:",r.get("eligible",0),"Dispatched:",r.get("dispatched",0),"Dispatch errors:",r.get("dispatchErrors",0)); sys.exit(1 if r.get("dispatchErrors",0) else 0)'

# Production bootstrap marker: the matching commit message starts the first cycle.
