name: Deploy GTA6 Shorts Worker
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gta6-shorts-worker-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub repository Actions secrets."
            exit 1
          fi
          npx --yes wrangler@4.45.0 deploy
      - name: Start automatic production cycle after every Worker deployment
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          RENDER_WEBHOOK_SECRET: ${{ secrets.RENDER_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --retry 3 --retry-all-errors --retry-delay 2 --fail-with-body --silent --show-error --max-time 600 -X POST "https://gta6-shorts-engine.alperen-gkhn.workers.dev/api/prepare" -H "Content-Type: application/json" -H "X-Render-Secret: $RENDER_WEBHOOK_SECRET" --data '{}')"
          printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); r=d.get("rendering",{}); print("Prepared:",d.get("created",0),"updated:",d.get("updated",0),"existing:",d.get("existing",0),"skipped_permissions:",d.get("skipped_permission",0)); print("Twitch discovery:",json.dumps(d.get("discovery",{}),ensure_ascii=False)); print("Clip validation:",json.dumps(d.get("clip_validation",{}),ensure_ascii=False)); print("Duration validation:",json.dumps(d.get("duration_validation",{}),ensure_ascii=False)); a=d.get("download_access",{}); print("Twitch download access:",json.dumps({k:a.get(k) for k in ("twitch_oauth_connected","twitch_download_scope_available","requires_twitch_connection","missing_scopes","processed","checked_this_cycle","broadcasters_checked","downloadable","unauthorized","not_available","errors","remaining")},ensure_ascii=False)); print("Batch result:",json.dumps({k:r.get(k) for k in ("batch_id","batch_status","target_minimum","maximum_successes","eligible","attempted","dispatched","already_existing","dispatchErrors","attempts_total","pending","published","failed")},ensure_ascii=False)); print("Dispatch error details:",json.dumps(r.get("errors",[])[:10],ensure_ascii=False)); sys.exit(1 if r.get("dispatchErrors",0) else 0)'

# Production bootstrap marker: the matching commit message starts the first cycle.
