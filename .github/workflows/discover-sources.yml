name: Discover GTA6 Source Videos
on:
  push:
    paths:
      - "discovery-queue/**"
  workflow_dispatch:
    inputs:
      channel_url:
        description: Public HTTPS channel, videos tab, or playlist URL
        required: true
        type: string
      max_items:
        description: Number of recent entries to inspect (1-30)
        required: false
        default: "10"
        type: string
      callback_url:
        description: Authenticated Worker callback URL
        required: false
        default: "https://gta6-shorts-engine.alperen-gkhn.workers.dev/api/source/discovery-callback"
        type: string
      rights_confirmation:
        description: Operator confirmed reuse rights for this channel's content
        required: false
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source discovery tool
        run: python -m pip install --upgrade pip yt-dlp
      - name: Load queued discovery request
        if: github.event_name == 'push'
        run: |
          request_file="$(git show --pretty="" --name-only "$GITHUB_SHA" | grep -E '^discovery-queue/.*[.]json$' | tail -n 1)"
          test -n "$request_file"
          python - "$request_file" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              request = json.load(stream)
          values = {
              "CHANNEL_URL": request["channel_url"],
              "MAX_ITEMS": str(request.get("max_items", 10)),
              "CALLBACK_URL": request["callback_url"],
              "RIGHTS_CONFIRMATION": str(request.get("rights_confirmation") is True).lower(),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  env_file.write(f"{key}={value}\n")
          PY
      - name: Discover recent GTA VI videos (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          CHANNEL_URL: ${{ inputs.channel_url || 'https://www.youtube.com/@VIRUSHGTA6/videos' }}
          MAX_ITEMS: ${{ inputs.max_items || '10' }}
          CALLBACK_URL: ${{ inputs.callback_url || 'https://gta6-shorts-engine.alperen-gkhn.workers.dev/api/source/discovery-callback' }}
          RIGHTS_CONFIRMATION: ${{ inputs.rights_confirmation || 'true' }}
          RENDER_WEBHOOK_SECRET: ${{ secrets.RENDER_WEBHOOK_SECRET }}
        run: python renderer/discover.py
      - name: Discover recent GTA VI videos (queued run)
        if: github.event_name == 'push'
        env:
          RENDER_WEBHOOK_SECRET: ${{ secrets.RENDER_WEBHOOK_SECRET }}
        run: python renderer/discover.py
