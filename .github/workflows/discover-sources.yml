name: Discover GTA6 Source Videos
on:
  workflow_dispatch:
    inputs:
      channel_url:
        description: Public HTTPS channel, videos tab, or playlist URL
        required: true
        type: string
      max_items:
        description: Number of recent entries to inspect (1-30)
        required: false
        default: "10"
        type: string
      callback_url:
        description: Authenticated Worker callback URL
        required: false
        default: "https://gta6-shorts-engine.alperen-gkhn.workers.dev/api/source/discovery-callback"
        type: string
      rights_confirmation:
        description: Operator confirmed reuse rights for this channel's content
        required: false
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source discovery tool
        run: python -m pip install --upgrade pip yt-dlp
      - name: Discover recent GTA VI videos
        env:
          CHANNEL_URL: ${{ inputs.channel_url || 'https://www.youtube.com/@VIRUSHGTA6/videos' }}
          MAX_ITEMS: ${{ inputs.max_items || '10' }}
          CALLBACK_URL: ${{ inputs.callback_url || 'https://gta6-shorts-engine.alperen-gkhn.workers.dev/api/source/discovery-callback' }}
          RIGHTS_CONFIRMATION: ${{ inputs.rights_confirmation || 'true' }}
          RENDER_WEBHOOK_SECRET: ${{ secrets.RENDER_WEBHOOK_SECRET }}
        run: python renderer/discover.py
