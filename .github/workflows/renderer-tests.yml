name: Renderer policy tests
on:
  push:
    branches: ["**"]
    paths:
      - "renderer/**"
      - "tests/**"
      - ".github/workflows/renderer-tests.yml"
  pull_request:
    paths:
      - "renderer/**"
      - "tests/**"
      - ".github/workflows/renderer-tests.yml"
permissions:
  contents: read
jobs:
  renderer-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile renderer/render.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check src/index.js
      - name: Run renderer policy tests
        run: python -m unittest discover -s tests -v
