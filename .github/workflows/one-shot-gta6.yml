name: One-time GTA6 Short
on:
  push:
    paths:
      - ".github/workflows/one-shot-gta6.yml"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install yt-dlp
      - name: Render original Twitch clip
        run: |
          python renderer/render.py \
            --source-url "https://www.twitch.tv/lacy/clip/RelievedRichRhinocerosPeteZaroll-qOXHVQ3XVK3asCkK" \
            --title "THE RELEASE OF GTA VI" \
            --output short.mp4
      - name: Upload MP4 and media analysis
        uses: actions/upload-artifact@v4
        with:
          name: gta6-short-first-real-source
          path: |
            short.mp4
            render-analysis.json
          if-no-files-found: error
          retention-days: 7

