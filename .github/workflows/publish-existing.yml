name: Publish Existing GTA6 Short
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load publish task
        id: task
        run: |
          FILE="$(git show --pretty="" --name-only HEAD | awk 'index($0,"publish-queue/")==1 && substr($0,length($0)-4)==".json" {print; exit}')"
          test -n "$FILE"
          python - "$FILE" >> "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          for k in ("video_url","cover_url","title","description"):
              print(f"{k}={str(d.get(k,'' )).replace(chr(10),' ')}")
          PY
      - name: Download already-rendered MP4 and cover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL -H "Accept: application/octet-stream" -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/alperengkhn-sys/gta6-shorts-factory/releases/assets/787905070 -o short.mp4
          curl -fL -H "Accept: application/octet-stream" -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/alperengkhn-sys/gta6-shorts-factory/releases/assets/787905071 -o short-cover.jpg
          test -s short.mp4
          test -s short-cover.jpg
      - name: Publish publicly to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SHORT_TITLE: ${{ steps.task.outputs.title }}
          SHORT_DESCRIPTION: ${{ steps.task.outputs.description }}
        run: python renderer/youtube_upload.py
