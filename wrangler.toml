name = "gta6-shorts-engine"
main = "src/index.js"
compatibility_date = "2026-11-19"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "gta6-shorts-db"
database_id = "3a6b99a0-cfbf-48dd-ad78-68f2cb6432dd"

[observability]
enabled = true

[triggers]
crons = ["0 */3 * * *"]

# [initial-production] Verify successful-publish target and automatic replacement batch in production.
# Trigger an audited first production discovery after the Worker deployment.

# Automated public Twitch clip discovery and Shorts publishing runs every three hours.

# Worker Previews require their own binding declarations.
# Until a dedicated staging D1 database is provisioned, the Preview binding points
# to the existing D1 resource, but APP_ENV=preview disables all DB-backed routes
# before any database operation. Replace this ID with a dedicated staging D1 ID
# before enabling functional Preview traffic.
[previews.vars]
APP_ENV = "preview"

[[previews.d1_databases]]
binding = "DB"
database_name = "gta6-shorts-db"
database_id = "3a6b99a0-cfbf-48dd-ad78-68f2cb6432dd"
